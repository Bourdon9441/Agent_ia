<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant Hub — Centre de contrôle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark" id="brandMark"></div>
      <div><h1>AI ASSISTANT HUB</h1><small>centre de contrôle</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="chip" id="chipSync"></div>
      <button class="account-btn" id="accountBtn"></button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main id="view" class="view"></main>
</div>

<div class="overlay" id="authOverlay">
  <div class="modal">
    <button class="iconbtn close-x" id="authClose"></button>
    <h2 id="authTitle"></h2>
    <div class="sub" id="authSub"></div>
    <div id="authBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
